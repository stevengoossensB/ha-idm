name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version in manifest
        run: |
          version="${GITHUB_REF#refs/tags/}"
          # Remove 'v' prefix if present
          version="${version#v}"
          python - "$version" <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("custom_components/idm/manifest.json")
          m = json.loads(p.read_text())
          m["version"] = sys.argv[1]
          p.write_text(json.dumps(m, indent=2) + "\n")
          PY

      - name: Create zip
        run: |
          cd custom_components/idm
          zip -r idm.zip ./ -x '*__pycache__*'

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/idm/idm.zip
